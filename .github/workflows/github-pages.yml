name: 構建 Github Pages

on:
  push:
    branches: [main] # 如果你的主分支叫 master，請改為 master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v6

      - name: 設定 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 設定 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 快取 pnpm 依賴
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-pages-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-pages-

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 構建前端專案
        run: pnpm run build

      - name: 驗證構建產物
        run: |
          if [ ! -d "docs" ]; then
            echo "❌ 構建失敗：docs 目錄不存在"
            exit 1
          fi
          if [ ! -f "docs/index.html" ]; then
            echo "❌ 構建失敗：docs/index.html 不存在"
            exit 1
          fi
          echo "✅ 構建產物驗證透過"
          ls -la docs/

      # 關鍵步驟：告訴 GitHub Actions 跳過 Jekyll 檢查
      - name: 配置 Github Pages
        uses: actions/configure-pages@v5

      - name: 上傳構建版
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
